spring.application.name=futbol-api

# Conexion BD (toma variables de entorno en Render o usa valores locales por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/futbol_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:7652}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Puerto dinamico requerido por Render
server.port=${PORT:8080}

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
